# Keep this workflow path: its run number continues the existing 7000 + run sequence.
# HMYZAK_KEYSTORE_BASE64 must contain the EXISTING installed app's signing key.
name: Hmyzák – podepsané APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Zveřejnit ověřené APK v Releases (pouze z main)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hmyzak-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    outputs:
      short_version: ${{ steps.package.outputs.short_version }}
    steps:
      - name: Ověřit větev pro zveřejnění
        if: inputs.publish_release && github.ref != 'refs/heads/main'
        run: |
          echo 'Zveřejnění je povolené pouze z main. Pro kandidátní APK vypni publish_release.' >&2
          exit 1

      - name: Zdrojový kód
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Doinstalovat SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Ověřit Gradle Wrapper
        run: bash ./prepare-gradle-wrapper.sh

      - name: Nastavit navazující verzi
        run: python3 tools/release_tools.py version --run-number "$GITHUB_RUN_NUMBER" --github-env "$GITHUB_ENV"

      - name: Ověřit migraci a pravidla vydání
        run: |
          python3 docs/overit_migraci_mereni.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Testy a lint před použitím klíče
        run: bash ./gradlew :app:testReleaseUnitTest :app:lintRelease --no-daemon

      - name: Obnovit původní podepisovací klíč pouze v CI
        env:
          KEYSTORE_BASE64: ${{ secrets.HMYZAK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Chybí secret HMYZAK_KEYSTORE_BASE64. Nevytvářej nový klíč.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/hmyzak-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          test -s "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          echo "HMYZAK_SIGNING_STORE_FILE=$RUNNER_TEMP/hmyzak-signing/installed-app.keystore" >> "$GITHUB_ENV"

      - name: Sestavit podepsané APK ze zdrojů
        env:
          HMYZAK_SIGNING_STORE_PASSWORD: ${{ secrets.HMYZAK_STORE_PASSWORD }}
          HMYZAK_SIGNING_KEY_ALIAS: ${{ secrets.HMYZAK_KEY_ALIAS }}
          HMYZAK_SIGNING_KEY_PASSWORD: ${{ secrets.HMYZAK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HMYZAK_SIGNING_STORE_PASSWORD"
          test -n "$HMYZAK_SIGNING_KEY_ALIAS"
          test -n "$HMYZAK_SIGNING_KEY_PASSWORD"
          bash ./gradlew :app:assembleRelease --no-daemon

      - name: Ověřit certifikát, applicationId a číslo verze
        id: package
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          python3 tools/release_tools.py verify --apk "$APK" --report dist/overeni-apk.json
          cp "$APK" "dist/Hmyzak-v${HMYZAK_SHORT_VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          echo "short_version=$HMYZAK_SHORT_VERSION" >> "$GITHUB_OUTPUT"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Odstranit dočasný podepisovací klíč
        if: always()
        run: rm -f "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"

      - name: Uložit ověřeného kandidáta
        uses: actions/upload-artifact@v4
        with:
          name: Hmyzak-APK-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Výsledky kontrol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hmyzak-release-kontroly-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: signed-apk
    if: inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Stáhnout ověřeného kandidáta z tohoto běhu
        uses: actions/download-artifact@v4
        with:
          name: Hmyzak-APK-${{ github.run_number }}
          path: dist

      - name: Ověřit kontrolní součet
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Vydat APK ke stažení z telefonu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HMYZAK_SHORT_VERSION: ${{ needs.signed-apk.outputs.short_version }}
        run: |
          gh release create "hmyzak-build-${GITHUB_RUN_NUMBER}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hmyzák v${HMYZAK_SHORT_VERSION} – build ${GITHUB_RUN_NUMBER}" \
            --notes 'APK sestavené přímo ze zdrojů. CI ověřilo původní certifikát, applicationId a navazující verzi. Před instalací uchovej a ověř JSON zálohu dat.' \
            --latest=false
