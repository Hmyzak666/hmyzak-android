# Hmyzák: securely sign and publish an APK that updates the installed app.
# WARNING: HMYZAK_KEYSTORE_BASE64 must be the EXACT key used to sign the
# original installed app, not a new key generated by GitHub Actions.
name: Hmyzák – podepsané APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hmyzak-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Zdrojový kód
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Doinstalovat SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Získat a ověřit Gradle Wrapper
        run: bash ./prepare-gradle-wrapper.sh

      - name: Obnovit podepisovací klíč pouze v CI
        env:
          KEYSTORE_BASE64: ${{ secrets.HMYZAK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Chybí secret HMYZAK_KEYSTORE_BASE64.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/hmyzak-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          test -s "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          echo "HMYZAK_SIGNING_STORE_FILE=$RUNNER_TEMP/hmyzak-signing/installed-app.keystore" >> "$GITHUB_ENV"

      - name: Nastavit vždy vyšší verzi
        run: |
          echo "HMYZAK_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HMYZAK_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Sestavit podepsané APK
        env:
          HMYZAK_SIGNING_STORE_PASSWORD: ${{ secrets.HMYZAK_STORE_PASSWORD }}
          HMYZAK_SIGNING_KEY_ALIAS: ${{ secrets.HMYZAK_KEY_ALIAS }}
          HMYZAK_SIGNING_KEY_PASSWORD: ${{ secrets.HMYZAK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HMYZAK_SIGNING_STORE_PASSWORD"
          test -n "$HMYZAK_SIGNING_KEY_ALIAS"
          test -n "$HMYZAK_SIGNING_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Ověřit podpis a připravit APK pro telefon
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/Hmyzak-v0.2-build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Uložit APK mezi artefakty
        uses: actions/upload-artifact@v4
        with:
          name: Hmyzak-APK-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Vydat APK ke stažení přímo z telefonu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "hmyzak-build-${GITHUB_RUN_NUMBER}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hmyzák – build ${GITHUB_RUN_NUMBER}" \
            --notes "Automaticky sestavené a podepsané APK. Instalovat pouze pokud odpovídá podpis už nainstalované aplikace. Před první aktualizací ověř JSON zálohu." \
            --latest=false
