# Hmyzák: securely sign and publish an APK that updates the installed app.
# WARNING: HMYZAK_KEYSTORE_BASE64 must be the EXACT key used to sign the
# original installed app, not a new key generated by GitHub Actions.
name: Hmyzák – podepsané APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hmyzak-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Zdrojový kód
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Aplikovat aktualizaci nahranou z telefonu
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, shutil, zipfile
          root = pathlib.Path.cwd().resolve()
          candidates = []
          for candidate in root.glob("Hmyzak_update_v*.zip"):
              match = re.fullmatch(r"Hmyzak_update_v(\d+)\.(\d+)\.zip", candidate.name)
              if match:
                  candidates.append((int(match.group(1)), int(match.group(2)), candidate))
          archive = max(candidates)[2] if candidates else None
          if archive is not None:
              with zipfile.ZipFile(archive) as z:
                  entries = [item for item in z.infolist() if not item.is_dir()]
                  if not entries:
                      raise SystemExit("ZIP neobsahuje soubory.")
                  for item in entries:
                      name = item.filename
                      path = pathlib.PurePosixPath(name)
                      if (path.is_absolute() or ".." in path.parts or
                          not (name.startswith("app/") or name.startswith("docs/")) or
                          item.file_size > 10_000_000):
                          raise SystemExit(f"Nepovoleny soubor v ZIP: {name}")
                      target = (root / name).resolve()
                      if not target.is_relative_to(root):
                          raise SystemExit(f"Nepovolena cesta: {name}")
                  for item in entries:
                      target = root / item.filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, target.open("wb") as dest:
                          shutil.copyfileobj(source, dest)
              print(f"Hmyzak: pouzita aktualizace {archive.name} ({len(entries)} souboru).")
          else:
              print("Hmyzak: zadny verzovany aktualizacni ZIP zatim neni nahran.")
          PYCODE

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Doinstalovat SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Získat a ověřit Gradle Wrapper
        run: bash ./prepare-gradle-wrapper.sh

      - name: Obnovit podepisovací klíč pouze v CI
        env:
          KEYSTORE_BASE64: ${{ secrets.HMYZAK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Chybí secret HMYZAK_KEYSTORE_BASE64.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/hmyzak-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          test -s "$RUNNER_TEMP/hmyzak-signing/installed-app.keystore"
          echo "HMYZAK_SIGNING_STORE_FILE=$RUNNER_TEMP/hmyzak-signing/installed-app.keystore" >> "$GITHUB_ENV"

      - name: Nastavit verzi podle aktualizačního balíčku
        run: |
          set -euo pipefail
          VERSION_FILE='app/release-version.properties'
          if [[ ! -f "$VERSION_FILE" ]]; then
            echo "Chybí $VERSION_FILE: nejdříve nahraj aktualizační ZIP v0.4." >&2
            exit 1
          fi
          BASE=$(sed -n 's/^versionBaseCode=//p' "$VERSION_FILE" | head -1)
          NAME=$(sed -n 's/^versionName=//p' "$VERSION_FILE" | head -1)
          [[ "$BASE" =~ ^[0-9]+$ ]] || { echo 'Neplatné versionBaseCode.' >&2; exit 1; }
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+$ ]] || { echo 'Neplatné versionName.' >&2; exit 1; }
          echo "HMYZAK_VERSION_CODE=$((BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HMYZAK_VERSION_NAME=${NAME}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "HMYZAK_SHORT_VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Sestavit podepsané APK
        env:
          HMYZAK_SIGNING_STORE_PASSWORD: ${{ secrets.HMYZAK_STORE_PASSWORD }}
          HMYZAK_SIGNING_KEY_ALIAS: ${{ secrets.HMYZAK_KEY_ALIAS }}
          HMYZAK_SIGNING_KEY_PASSWORD: ${{ secrets.HMYZAK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HMYZAK_SIGNING_STORE_PASSWORD"
          test -n "$HMYZAK_SIGNING_KEY_ALIAS"
          test -n "$HMYZAK_SIGNING_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Ověřit podpis a připravit APK pro telefon
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/Hmyzak-v${HMYZAK_SHORT_VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Uložit APK mezi artefakty
        uses: actions/upload-artifact@v4
        with:
          name: Hmyzak-APK-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Vydat APK ke stažení přímo z telefonu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "hmyzak-build-${GITHUB_RUN_NUMBER}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hmyzák v${HMYZAK_SHORT_VERSION} – build ${GITHUB_RUN_NUMBER}" \
            --notes "Automaticky sestavené a podepsané APK. Instalovat pouze pokud odpovídá podpis už nainstalované aplikace. Před první aktualizací ověř JSON zálohu." \
            --latest=false
