name: LiftAnt – kontrola zdrojů

on:
  push:
    branches-ignore: ['backup/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmyzak-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Zdrojový kód
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Doinstalovat SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Ověřit Gradle Wrapper
        run: bash ./prepare-gradle-wrapper.sh

      - name: Ověřit migraci a pravidla vydání
        run: |
          python3 docs/overit_migraci_mereni.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Testy, lint a sestavení ze zdrojů
        run: |
          flags=()
          if [[ "$GITHUB_REF" == "refs/heads/release/liftant-play-v1" ]]; then
            export HMYZAK_VERSION_CODE=13038 HMYZAK_VERSION_NAME=0.13.38
            flags=(-PliftantPlayBuild=true -PliftantExternalSigning=true)
          fi
          bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease "${flags[@]}" --no-daemon
          if [[ "$GITHUB_REF" == "refs/heads/release/liftant-play-v1" ]]; then
            python3 tools/verify_play_intermediate.py
          fi

      - name: Výsledky kontrol
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Hmyzak-kontroly-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/bundle/release/
            app/build/outputs/play-external/
          if-no-files-found: warn
          retention-days: 14
